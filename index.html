<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Scoreboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .scoreboard {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .score {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .extras, .partnership, .runrate {
            font-size: 18px;
            margin-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            padding: 8px 12px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0b7dda;
        }
        /* Summary Modal */
        #summaryModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
        }
        #summaryContent {
            background: white;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 800px;
        }
    </style>
</head>
<body>

<div class="scoreboard">
    <div class="score">
        <span id="score">0/0</span>
        <span id="overs">Overs: 0.0</span>
    </div>
    <div class="extras" id="extras">Extras: 0</div>
    <div class="partnership" id="partnership">Partnership: 0(0)</div>
    <div class="runrate" id="runrate">CRR: 0.00</div>
    
    <h3>Batting</h3>
    <table>
        <thead>
            <tr>
                <th>Batsman</th>
                <th>R</th>
                <th>B</th>
                <th>4s</th>
                <th>6s</th>
                <th>SR</th>
            </tr>
        </thead>
        <tbody id="batsmanTable"></tbody>
    </table>
    
    <h3>Bowling</h3>
    <table>
        <thead>
            <tr>
                <th>Bowler</th>
                <th>O</th>
                <th>M</th>
                <th>R</th>
                <th>W</th>
                <th>Econ</th>
            </tr>
        </thead>
        <tbody id="bowlerTable"></tbody>
    </table>
    
    <button onclick="showSummary()">Match Summary</button>
</div>

<div id="summaryModal">
    <div id="summaryContent">
        <h2>Match Summary</h2>
        <div id="summaryData"></div>
        <button onclick="closeSummary()">Close</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js"></script>
<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDRKiA-PyUaOhj9oZxb9kUWD1gEGlVD0TY",
        authDomain: "cricket-scoreboard-137.firebaseapp.com",
        databaseURL: "https://cricket-scoreboard-137-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "cricket-scoreboard-137",
        storageBucket: "cricket-scoreboard-137.firebasestorage.app",
        messagingSenderId: "322609618880",
        appId: "1:322609618880:web:11a759155143c94b34f225"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function enableLiveSync() {
        firebase.database().ref("gameState").on("value", (snapshot) => {
            if (snapshot.exists()) {
                updateAllDisplay(snapshot.val());
            }
        });
    }

    function updateAllDisplay(state) {
        document.getElementById("score").textContent = `${state.runs}/${state.wickets}`;
        document.getElementById("overs").textContent = `Overs: ${state.overs}.${state.balls}`;
        document.getElementById("extras").textContent = `Extras: ${state.extras}`;
        document.getElementById("partnership").textContent = `Partnership: ${state.partnership.runs}(${state.partnership.balls})`;
        document.getElementById("runrate").textContent = `CRR: ${state.crr.toFixed(2)}`;
        updateBatsmanStats(state.batsmen);
        updateBowlerStats(state.bowlers);
    }

    function updateBatsmanStats(batsmen) {
        const table = document.getElementById("batsmanTable");
        table.innerHTML = "";
        batsmen.forEach(b => {
            const row = `<tr>
                <td>${b.name}</td>
                <td>${b.runs}</td>
                <td>${b.balls}</td>
                <td>${b.fours}</td>
                <td>${b.sixes}</td>
                <td>${b.strikeRate.toFixed(2)}</td>
            </tr>`;
            table.innerHTML += row;
        });
    }

    function updateBowlerStats(bowlers) {
        const table = document.getElementById("bowlerTable");
        table.innerHTML = "";
        bowlers.forEach(b => {
            const row = `<tr>
                <td>${b.name}</td>
                <td>${b.overs}</td>
                <td>${b.maidens}</td>
                <td>${b.runs}</td>
                <td>${b.wickets}</td>
                <td>${b.economy.toFixed(2)}</td>
            </tr>`;
            table.innerHTML += row;
        });
    }

    function showSummary() {
        firebase.database().ref("matchSummary").once("value", (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                let html = `
                    <p><strong>Result:</strong> ${data.result}</p>
                    <p><strong>Man of the Match:</strong> ${data.mom}</p>
                    <h4>Innings 1:</h4>
                    <p>${data.innings1.score} (${data.innings1.overs} overs)</p>
                    <h4>Innings 2:</h4>
                    <p>${data.innings2.score} (${data.innings2.overs} overs)</p>
                `;
                document.getElementById("summaryData").innerHTML = html;
                document.getElementById("summaryModal").style.display = "block";
            }
        });
    }

    function closeSummary() {
        document.getElementById("summaryModal").style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", enableLiveSync);
</script>

</body>
</html>
